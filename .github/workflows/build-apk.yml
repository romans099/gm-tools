name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install dependencies
        run: |
          npm install
          npm install -g @capacitor/cli
          
      - name: Build web app
        run: npm run build
        
      - name: Initialize Capacitor and add Android
        run: |
          npx cap init gm-tools ru.gmtools.app
          npx cap add android
          # Копируем dist в www для Capacitor
          cp -r dist www
          # Обновляем capacitor.config.json
          sed -i 's/"webDir": "dist"/"webDir": "www"/' capacitor.config.json
          npx cap sync android
        
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gm-tools.apk
          path: android/app/build/outputs/apk/debug/*.apk
