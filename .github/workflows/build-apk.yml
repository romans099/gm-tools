name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install and Build
        run: |
          npm install
          npm install -g @capacitor/cli
          npm run build
          
          # Создаём www папку из dist
          mkdir -p www
          cp -r dist/* www/
          
          # Создаём capacitor.config.json
          echo '{
            "appId": "ru.gmtools.app",
            "appName": "GM Tools",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }' > capacitor.config.json
          
          npx cap init gm-tools ru.gmtools.app
          npx cap add android
          npx cap sync android
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gm-tools
          path: android/app/build/outputs/apk/debug/*.apk
